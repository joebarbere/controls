name: Setup workspace
description: Node (from .nvmrc) + pnpm (from packageManager) + install, with an optional pnpm store cache.
# Actions are pinned to full commit SHAs; the comment is the release tag. To update, see
# docs/caveats/workspace.md ("Actions are pinned").
inputs:
  cache:
    description: "Restore and save the pnpm store cache ('true' or 'false'). release.yml turns it off."
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    # Reads the version from package.json `packageManager` (no `version` input). Its own store
    # cache defaults to off; setup-node's `cache: pnpm` is the only cache.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        # Auto-caching (v5+) only applies to npm since v6; keep it off explicitly.
        package-manager-cache: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
