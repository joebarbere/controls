# Pushes to main: the same three-OS matrix as pull requests (ci.yml), so platform regressions
# surface before a release tag.
name: main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
