# Tag push (vX.Y.Z) → verify → create a DRAFT GitHub Release (title and notes from CHANGELOG.md)
# → build installers on all three OSes → upload into the draft. A human (via release-engineer /
# `/release`) checks the draft and publishes it.
name: release

on:
  push:
    tags: ['v*.*.*']
  # Rehearsal: package + smoke-test on all three OSes from any branch, uploading nothing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

# Read-only by default; only the packaging job, which uploads to the draft release, can write.
permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here runs authenticated git
      - uses: ./.github/actions/setup
        with:
          cache: 'false' # release builds install from the registry, not from a restored cache
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - name: pnpm verify (== local)
        run: pnpm verify

  # Creates the draft (title and notes from CHANGELOG.md) before any upload, so the three build
  # jobs find it by tag instead of racing to create one each. electron-builder never edits an
  # existing release's title or body. On a rehearsal it only extracts the notes (job summary).
  draft:
    name: draft release notes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create/edit (tag push only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # gh uses GH_TOKEN
      # Node only (tools/release-notes.mjs has no dependencies), so no install and no cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Notes and title from CHANGELOG.md
        id: notes
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A tag push uses the tag (verify checked it matches package.json); a rehearsal uses package.json.
          if [ "$EVENT" = push ]; then set -- "$REF_NAME"; else set --; fi
          node tools/release-notes.mjs "$@" > "$RUNNER_TEMP/release-notes.md"
          title="$(node tools/release-notes.mjs "$@" --title)"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          { echo "## ${title}"; echo; cat "$RUNNER_TEMP/release-notes.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Create (or refresh) the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          case "$state" in
            true) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$notes" ;;
            false)
              echo "::error::release ${TAG} is already published; never re-release a published tag"
              exit 1
              ;;
            *) gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TITLE" --notes-file "$notes" ;;
          esac

  build:
    name: package ${{ matrix.os }}
    needs: [verify, draft]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # electron-builder --publish always uploads into the draft the `draft` job made
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned until the signing decision (plan §9.3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # electron-builder publishes through the REST API with GH_TOKEN, not git.
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build app directory
        run: pnpm build:desktop
      - name: Package (no upload yet)
        run: pnpm exec electron-builder --config apps/desktop/electron-builder.config.cjs --publish never
      - name: Install Playwright (smoke test of the packaged app)
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test packaged Linux app
        if: runner.os == 'Linux'
        env:
          CONTROLS_E2E_EXECUTABLE: ${{ github.workspace }}/dist/release/linux-unpacked/controls
        run: xvfb-run -a pnpm exec playwright test -c apps/desktop-e2e/playwright.config.mts
      - name: Smoke-test packaged Windows app
        if: runner.os == 'Windows'
        env:
          CONTROLS_E2E_EXECUTABLE: ${{ github.workspace }}\dist\release\win-unpacked\Controls.exe
        run: pnpm exec playwright test -c apps/desktop-e2e/playwright.config.mts
      - name: Smoke-test packaged macOS app
        if: runner.os == 'macOS'
        env:
          CONTROLS_E2E_EXECUTABLE: ${{ github.workspace }}/dist/release/mac-universal/Controls.app/Contents/MacOS/Controls
        run: pnpm exec playwright test -c apps/desktop-e2e/playwright.config.mts
      # Only a build that passed its smoke test reaches the draft release. Same inputs → same artifacts.
      - name: Upload to draft release
        if: github.event_name == 'push'
        run: pnpm exec electron-builder --config apps/desktop/electron-builder.config.cjs --publish always
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          # Unique per attempt (artifacts are immutable), as in ci.yml.
          name: release-logs-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/.playwright
            dist/release/builder-debug.yml
          # dist/.playwright is a dot-directory: without this only builder-debug.yml uploads.
          include-hidden-files: true
          retention-days: 7
