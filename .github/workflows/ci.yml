# Reusable: `pnpm verify` (== local) plus both e2e suites on Linux, macOS and Windows.
# Called by pr.yml and main.yml so a pull request runs exactly what main runs. Change the steps
# here, never in a caller. Every step is a local command: no CI-only checks.
name: ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify + e2e (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here runs authenticated git
      - uses: ./.github/actions/setup
      - name: pnpm verify (== local)
        run: pnpm verify
      # Prints the bench report `pnpm verify`'s bench target wrote (Nx hides a passing task's output),
      # each gated case's ratio first, so every OS's timings are in the log. It checks nothing:
      # verify stays == local.
      - name: sim bench report
        if: always()
        run: node tools/print-bench-report.mjs
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web harness e2e
        run: pnpm e2e
      - name: Electron smoke e2e (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e:desktop
      - name: Electron smoke e2e
        if: runner.os != 'Linux'
        run: pnpm e2e:desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          # Unique per attempt: artifacts are immutable, so a re-run can't reuse a name.
          name: playwright-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/.playwright
          # Everything under a dot-directory counts as hidden and is skipped by default.
          include-hidden-files: true
          retention-days: 7
