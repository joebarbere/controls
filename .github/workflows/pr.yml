# Pull requests: the exact `pnpm verify` contract plus both e2e suites on Linux.
name: pr

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify + e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pnpm verify (== local)
        run: pnpm verify
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web harness e2e
        run: pnpm e2e
      - name: Electron smoke e2e
        run: xvfb-run -a pnpm e2e:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ github.run_id }}
          path: dist/.playwright
          retention-days: 7
